# Netlify Configuration File for True Life Productions
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.processing]
  # Enable built-in optimization on deploy
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/play-*"
  to = "/play-details.html"
  status = 200

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
